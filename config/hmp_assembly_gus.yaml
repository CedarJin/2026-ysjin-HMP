# HMP assembly + GUS abundance (mirrors 2026-ysjin-gus)
sample_list: "data/HMP_GUS/manifests/HMASM_WGS_stool_SRS_samples.txt"
results_dir: "results/hmp_assembly_gus"
read_stage_dir: "results/hmp_assembly_gus/reads"
assembly_dir: "results/hmp_assembly_gus/assembly/megahit"
contigs_basename: "final.contigs.fa"
min_contig_length: 1000

# Existing HMP preprocessed reads (HMASM already dedup+trimmed).
hmp_reads_dir: "results/hmp_active_gus/reads"
hmp_repaired_reads_dir: "results/hmp_active_gus/repaired_reads"
repair_samples:
  - "SRS023176"

# Reuse references / scripts from the gus project for exact parity.
gus_root: "/home/jys0914/2026-ysjin-gus"
gus_scripts_dir: "/home/jys0914/2026-ysjin-gus/scripts"
reference_dir: "/home/jys0914/2026-ysjin-gus/results/reference"
total_faa: "/home/jys0914/2026-ysjin-gus/results/reference/gus_279_plus_fmn.faa"
total_metadata: "/home/jys0914/2026-ysjin-gus/results/reference/gus_279_plus_fmn_metadata.tsv"
candidate_faa: "/home/jys0914/2026-ysjin-gus/results/reference/candidate_gus.faa"
candidate_metadata: "/home/jys0914/2026-ysjin-gus/results/reference/candidate_gus_metadata.tsv"
active_faa: "/home/jys0914/2026-ysjin-gus/results/reference/active_gus.faa"
active_metadata: "/home/jys0914/2026-ysjin-gus/results/reference/active_gus_metadata.tsv"

threads: 8
threads_megahit: 8
threads_bowtie2: 8
threads_featurecounts: 8
threads_prodigal: 8
threads_diamond: 8

diamond:
  evalue: 1.0e-5
  max_target_seqs: 25

# Default filters in gus summarize_gus_hits.py / gus_abundance.yaml
summarize:
  min_identity: 40.0
  min_query_cov: 0.5
  min_subject_cov: 0.5
  max_evalue: 1.0e-5

# Strict active-GUS profile used for cross-project comparison
strict_active:
  min_identity: 95.0
  min_query_cov: 0.9
  min_subject_cov: 0.9
  max_evalue: 1.0e-5
